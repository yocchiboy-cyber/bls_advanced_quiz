<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>応用編 こんなときどうすべき編 ― BLS独立ケース集 | Twine教材試作</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f0ea;color:#2f2a24;line-height:1.85}
  .wrap{max-width:700px;margin:0 auto;padding:26px 18px 60px}
  header{text-align:center;padding:20px 0 6px}
  .kicker{font-size:11px;letter-spacing:.25em;color:#7d6a4f}
  h1{font-size:24px;margin:6px 0 4px}
  header p{font-size:13px;color:#77644c;margin:4px 0}
  .status{display:flex;justify-content:space-between;font-size:12.5px;color:#77644c;margin-top:14px}
  .card{background:#fffdf8;border:1px solid #e0d4bd;border-radius:16px;padding:26px 24px;margin-top:12px;box-shadow:0 6px 22px rgba(90,60,20,.07)}
  .step{display:inline-block;background:#efe6d2;color:#7a5a17;font-size:12px;font-weight:700;border-radius:99px;padding:3px 12px;margin-bottom:12px}
  .scene{white-space:pre-line;margin:0 0 10px}
  .q{font-weight:700;font-size:17px;margin:14px 0 6px}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .choice{text-align:left;font-size:15px;background:#fff;border:1.5px solid #cbb98c;border-radius:12px;padding:13px 16px;cursor:pointer;color:#2f2a24;transition:.15s;font-family:inherit;line-height:1.6;width:100%}
  .choice:hover{background:#fdf3df;border-color:#b98a2e}
  .choice .done{color:#2e8b57;font-weight:700}
  .fail{background:#fdf0ec;border:1px solid #e5a08c;border-radius:12px;padding:16px 18px;white-space:pre-line}
  .failtitle{font-weight:700;color:#a03d24;margin-bottom:8px}
  .why{background:#eef6f0;border:1px solid #9cc7ab;border-radius:12px;padding:16px 18px;white-space:pre-line}
  .refs{background:#f6f2e9;border:1px dashed #c9b78f;border-radius:12px;padding:12px 16px;margin-top:14px;font-size:12.5px;color:#6b5b40;word-break:break-all;white-space:pre-line}
  .btn{display:block;margin-top:16px;width:100%;background:#8a6a1f;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover{background:#a37f27}
  .btn.sub{background:#fff;color:#7a5a17;border:1.5px solid #cbb98c}
  .note{font-size:12px;color:#96836a;text-align:center;margin-top:20px;line-height:1.7}
  .clear{font-size:20px;font-weight:700;color:#1d5c38;text-align:center}

  html{font-size:clamp(15px,2.6vw,17px)}
  .refs a{color:#7a5a17;text-decoration:underline;word-break:break-all}
  .qrbox{background:#fffdf8;border:1px dashed #c9b78f;border-radius:14px;padding:18px;text-align:center;margin-top:18px}
  .qrbox svg{max-width:190px;width:100%;height:auto;display:block;margin:0 auto}
  .qrbox p{font-size:13px;color:#77644c;margin:10px 0 0}
  .closing{text-align:center}
  .closing h2{font-size:22px;margin:6px 0 10px}
  .closing .scene{text-align:left}
  @media (max-width:600px){
    .wrap{padding:14px 12px 48px}
    .card{padding:20px 16px}
    h1{font-size:22px}
    .scene,.q{font-size:16px}
    .choice{font-size:16px;padding:15px 16px;min-height:52px}
    .btn{font-size:17px;padding:16px}
    .refs{font-size:13.5px}
    .qrbox svg{max-width:220px}
  }
.case-art{display:block;width:100%;height:auto;margin:0 0 16px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">BLS CASEBOOK — こんなときどうすべき編</div>
    <h1>応用編：こんなときどうすべき編</h1>
    <p>独立ケース集 ／ 全12ケース、好きな順にどうぞ ／ 各ケースに参照元つき</p>
    <p>間違えると「やっちゃった分岐」が見られます。それも教材です。</p>
  </header>
  <div class="status"><span id="progress">ケース選択</span><span id="mistakes">ミス 0 回</span></div>
  <div class="card" id="card"></div>
  <p class="note">本教材は学習用の試作です。参照元は、できるだけ公的機関（自治体消防・総務省消防庁・日本蘇生協議会など）の公開資料を優先しています。<br>実際の対応は最新のガイドラインと現場の指示に従ってください。</p>
</div>

function showCase(i){
  cur=i; const c=CASES[i];
  const [alt,data]=caseArt[c.id];
  const art=`<img class="case-art" width="506" height="250" alt="${alt}" src="data:image/webp;base64,${data}">`;
  document.body.style.background=CASE_COLORS[i]||'#f3f0ea';
  status('ケース '+c.id+' / '+CASES.length);
  card.innerHTML='<span class="step">ケース'+c.id+'</span>'+art+'<p class="scene">'+c.scene+'</p><p class="q">'+c.q+'</p><div class="choices">'+
    c.choices.map((ch,j)=>'<button class="choice" onclick="answer('+j+')">'+ch.t+'</button>').join('')+'</div>'+
    '<button class="btn sub" onclick="showMenu()">ケース選択に戻る</button>'+ '<button class="btn sub" onclick="showClosing()">ここまでにする</button>';
}
function answer(j){
  const c=CASES[cur], ch=c.choices[j];
  if(ch.ok){
    cleared.add(cur);
    card.innerHTML='<span class="step">ケース'+c.id+' ― 解説</span><div class="why">'+ch.why+'</div><div class="refs">'+linkify(c.refs)+'</div>'+
      '<button class="btn" onclick="showMenu()">ケース選択に戻る</button>'+ '<button class="btn sub" onclick="showClosing()">ここまでにする</button>';
    status('ケース '+c.id+' クリア');
  }else{
    mistakes++;
    card.innerHTML='<span class="step">やっちゃった分岐</span><div class="fail"><div class="failtitle">その選択の先にあった場面……</div>'+ch.fail+'</div>'+
      '<button class="btn" onclick="showWhy('+j+')">なぜダメなのか、解説を読む</button>';
    status('ケース '+c.id);
  }
}
function showWhy(j){
  const c=CASES[cur], ch=c.choices[j];
  card.innerHTML='<span class="step">ケース'+c.id+' ― 解説</span><div class="why">'+ch.why+'</div><div class="refs">'+linkify(c.refs)+'</div>'+
    '<button class="btn" onclick="showCase('+cur+')">もう一度このケースに挑戦する</button>'+
    '<button class="btn sub" onclick="showMenu()">ケース選択に戻る</button>';
}
showMenu();
